# ============================================================
# Parámetros del detector CUSUM y modelos de ruido de sensores
# TFM: Detección Colaborativa de Meaconing GNSS
# ============================================================
# Wildcard /** applies these parameters to ALL nodes in the launch file.

/**:
  ros__parameters:

    # --- Parámetros de ruido de sensores ---
    # σ_GNSS=1.0m ≈ GPS civil con SBAS (WAAS/EGNOS), realista y viable para detección
    # Con σ_GNSS=2.0m el ruido en Δ (~2.8m) es comparable a la señal del ataque → indetectable
    sigma_gnss: 1.0     # Desviación estándar del ruido GNSS (m)
    sigma_uwb: 0.24     # Desviación estándar del ruido UWB (m) - Fishberg et al. 2024 MURP

    # --- Parámetros del detector CUSUM ---
    # CUSUM de dos colas (S_plus + S_minus con δ signado):
    #   δ = D_UWB - D_GNSS (signado)
    #   S⁺_k = max(0, S⁺_{k-1} +  δ̄ - β)  → detecta colapso de D_GNSS (meaconing)
    #   S⁻_k = max(0, S⁻_{k-1} -  δ̄ - β)  → detecta inflado de D_GNSS (pattern attack)
    #   Alarma si S⁺_k > τ o S⁻_k > τ durante alert_confirm_time.
    #
    # Calibración: durante startup_delay se estima la mediana de δ_raw en
    # condiciones normales y se resta antes del CUSUM. Esto compensa el sesgo
    # de la norma Euclídea GNSS (el ruido de posición de media cero no produce
    # una distancia de media cero).
    #   Bajo H₀: E[δ_corregida] ≈ 0 → E[δ̄ - β] ≈ -β.
    #   Bajo ataque: δ̄ corregida es positiva → S⁺ crece.
    beta: 0.5           # Deriva permitida por paso (m) — referencia CUSUM
    tau: 3.0            # Umbral de detección
    filter_window: 30   # Muestras de la media móvil sobre δ (30 ≈ 1 s @ 30 Hz)
    alert_confirm_time: 2.0  # Segundos que S_k debe permanecer sobre τ antes de dar la alarma
    startup_delay: 10.0  # Warmup/calibración sin acumular CUSUM (s)

    # --- Parámetros del atacante ---
    drift_velocity: 0.2     # Velocidad de arrastre (drag-off) hacia el punto falso (m/s)
    activation_delay: 30.0  # Tiempo hasta activación del ataque (s)
    attack_type: single_antenna  # Tipo de ataque: 'single_antenna' (meaconing: señal retardada y retransmitida)

    # --- Semilla para reproducibilidad ---
    random_seed: 42     # Semilla fija para numpy (reproducibilidad determinista)

    # --- Frecuencia de operación ---
    update_rate: 30.0   # Frecuencia de actualización de los nodos (Hz)

    # --- Posiciones iniciales de los robots ---
    robot1:
      x: 0.0
      y: 0.0
    robot2:
      x: 3.0
      y: 0.0

    # --- Movimiento autónomo de los robots ---
    robot1_linear_vel: 0.15   # Velocidad lineal robot 1 (m/s)
    robot1_angular_vel: 0.30  # Velocidad angular robot 1 (rad/s)
    robot2_linear_vel: 0.12   # Velocidad lineal robot 2 (m/s)
    robot2_angular_vel: 0.25  # Velocidad angular robot 2 (rad/s)

    # --- Waypoint follower (E5) ---
    # Robot1 route (robot1 follows this via gnss_spoofed → drifts under attack)
    waypoints1_x: [5.0, 5.0, 0.0]   # Coordenadas X de la ruta robot1
    waypoints1_y: [0.0, 5.0, 5.0]   # Coordenadas Y de la ruta robot1
    # Robot2 route (offset +2 m in Y so D_UWB stays ≈ 2 m)
    waypoints2_x: [5.0, 5.0, 0.0]   # Coordenadas X de la ruta robot2
    waypoints2_y: [2.0, 7.0, 7.0]   # Coordenadas Y de la ruta robot2
    waypoint_arrival_dist: 0.5       # Distancia de llegada para avanzar al siguiente waypoint (m)
    linear_speed: 0.2                # Velocidad lineal deseada (m/s)
    lookahead: 0.8                   # Distancia de lookahead pure pursuit (m)
    publish_robot2: false            # Si true, robot2 en bucle abierto (legacy)
    robot2_waypoint_mode: false      # E5/E6: robot2 navega con GNSS (fuente según r2_gnss_source)
    r2_gnss_source: 'clean'            # 'clean' = E5 (robot2 usa gnss_clean), 'spoofed' = E6 (robot2 usa gnss_spoofed)
